# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: push to GitHub, then "New +" -> "Blueprint" and point it at this repo.
services:
  - type: web
    name: wedding
    runtime: node
    plan: starter         # Needed for the disk below (disks require a paid plan)
                          # and to keep the service awake — free instances sleep
                          # when idle, so the first guest of the day waits ~30s.
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /healthz
    # The disk is what makes RSVPs outlive a deploy — and you will deploy, since
    # adding a guest means editing guest-codes.json. 1 GB is far more than a
    # guest list needs; it's the smallest size Render offers, ~$0.25/month.
    # The server finds this mount on its own — no env var points at it. Drop the
    # block and RSVPs fall back to a working copy inside the container that every
    # deploy wipes; /admin says so in red when that happens.
    disk:
      name: rsvp-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false        # password for the /admin dashboard — set it in the Render
                           # dashboard. Leave it unset and /admin stays locked.
