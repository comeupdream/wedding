# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: push to GitHub, then "New +" -> "Blueprint" and point it at this repo.
services:
  - type: web
    name: wedding
    runtime: node
    plan: starter         # RSVPs live on the disk below, which needs a paid plan.
                          # For a free instance: set `plan: free`, delete the
                          # `disk:` block and the DATA_DIR var. RSVPs then survive
                          # only until the next deploy or restart — but every one
                          # is also printed to the service logs, and you can pull
                          # the whole list any time from /admin as CSV.
                          # Free instances also sleep when idle, so the first
                          # guest of the day waits ~30s for the page.
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /healthz
    disk:
      name: rsvp-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data   # rsvps.json (current answers) + rsvps.log.jsonl (every submission)
      - key: ADMIN_PASSWORD
        sync: false        # password for the /admin dashboard — set it in the Render
                           # dashboard. Leave it unset and /admin stays locked.
