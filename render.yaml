# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: push to GitHub, then "New +" -> "Blueprint" and point it at this repo.
databases:
  - name: wedding-db
    plan: basic-256mb   # The free Postgres plan is DELETED 30 days after it is
                        # created, along with every RSVP in it. Don't use it for
                        # a wedding that's further out than a month.
    region: ohio        # must match the service's region to stay on the private network

services:
  - type: web
    name: wedding
    runtime: node
    plan: starter       # free instances sleep when idle, so the first guest of
                        # the day would wait ~30s for the page to wake up
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:   # Render fills this in — the internal connection string,
          name: wedding-db   # which stays on the private network. The server
          property: connectionString   # creates its own tables on first boot.
      - key: ADMIN_PASSWORD
        sync: false     # password for the /admin dashboard — set it in the Render
                        # dashboard. Leave it unset and /admin stays locked.
