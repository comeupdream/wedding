# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: push to GitHub, then "New +" -> "Blueprint" and point it at this repo.
services:
  - type: web
    name: wedding
    runtime: node
    plan: free            # bump to starter for always-on (free instances sleep when idle)
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_PASSWORD
        sync: false       # password for the /admin RSVP dashboard — set in the Render dashboard
    # RSVPs are written to ./data/rsvps.json, which is wiped on each deploy or
    # restart unless a persistent disk is attached (requires the starter plan).
    # Every RSVP is also printed to the service logs as a backup copy.
    # To make storage durable, uncomment below and add env var DATA_DIR=/data:
    # disk:
    #   name: data
    #   mountPath: /data
    #   sizeGB: 1
